mutation ToggleFavorite($animeId: Int, $mangaId: Int, $characterId: Int) {
  ToggleFavourite(animeId: $animeId, mangaId: $mangaId, characterId: $characterId) {
    ...FavouritesData
  }
}

fragment FavouritesData on Favourites {
  anime {
    pageInfo {
      total
    }
  }
  characters {
    pageInfo {
      total
    }
  }
}
