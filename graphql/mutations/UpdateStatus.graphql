mutation UpdateStatus($mediaId: Int, $status: MediaListStatus) {
  SaveMediaListEntry(mediaId: $mediaId, status: $status) {
    id
    progress
    status
    score(format: POINT_10)
    media {
      id
      mediaListEntry {
        id
        progress
        status
        score(format: POINT_10)
      }
    }
  }
}
