# $formatIn narrows anime trending to TV shows (matching the old behavior);
# omit it for manga, where every format should trend.
query GetTrendingMedia(
  $type: MediaType!
  $formatIn: [MediaFormat]
  $page: Int = 1
  $perPage: Int = 20
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(
      format_in: $formatIn
      isAdult: false
      type: $type
      sort: [TRENDING_DESC]
    ) {
      ...MediaPosterFragment
    }
  }
}

query SearchMedia(
  $search: String
  $type: MediaType!
  $page: Int = 1
  $perPage: Int = 30
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    media(
      search: $search
      type: $type
      format_not_in: [MUSIC]
      isAdult: false
    ) {
      ...MediaPosterFragment
    }
  }
}
