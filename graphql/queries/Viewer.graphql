query GetViewer {
  Viewer {
    id
    name
    avatar {
      large
      medium
    }
    bannerImage
    unreadNotificationCount
    mediaListOptions {
      scoreFormat
    }
    favourites {
      anime {
        nodes {
          id
          title {
            english
            romaji
            native
          }
          coverImage {
            large
            medium
          }
        }
      }
      characters {
        nodes {
          id
          name {
            full
          }
          image {
            large
            medium
          }
        }
      }
    }
    statistics {
      anime {
        count
        minutesWatched
      }
      manga {
        count
        chaptersRead
      }
    }
  }
}
