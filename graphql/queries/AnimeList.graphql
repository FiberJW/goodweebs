# Page-based pagination (AniList's flat paginator). MediaListCollection's
# chunk pagination slices the user's RAW list across status boundaries for
# authenticated users — a status:CURRENT chunk can return stray groups from
# other statuses and hasNextChunk goes false while entries remain — so we
# paginate the flat Page.mediaList API instead. Sort is server-side so pages
# appended by fetchMore keep a stable order.
query GetAnimeList(
  $userId: Int
  $status: MediaListStatus
  $sort: [MediaListSort]
  $page: Int = 1
  $perPage: Int = 50
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
    }
    mediaList(userId: $userId, type: ANIME, status: $status, sort: $sort) {
      id
      media {
        ...AnimeListEntryFragment
      }
    }
  }
}
