# ponytail: accepts AniList's 500-entries-per-status cap; add chunk/perChunk
# pagination via fetchMore if users with >500 entries in one status report gaps.
query GetAnimeList(
  $userId: Int
  $status: MediaListStatus
  $sort: [MediaListSort]
) {
  MediaListCollection(
    userId: $userId
    type: ANIME
    status: $status
    sort: $sort
  ) {
    lists {
      status
      name
      isCustomList
      entries {
        id
        media {
          ...AnimeListEntryFragment
        }
      }
    }
  }
}
