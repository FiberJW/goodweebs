query GetAnimeList(
  $userId: Int
  $status: MediaListStatus
  $sort: [MediaListSort]
) {
  MediaListCollection(
    userId: $userId
    type: ANIME
    status: $status
    sort: $sort
  ) {
    lists {
      status
      name
      entries {
        id
        media {
          ...AnimeListEntryFragment
        }
      }
    }
    hasNextChunk
  }
}
