name: Checks

on:
  pull_request:
  push:
    branches: [senpai]

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  types-and-graphql:
    name: Typecheck + GraphQL validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # tsc covers gql.tada's inferred types (masking, readFragment, field access)
      # against the committed graphql-env.d.ts; gql:check validates every
      # graphql() document against graphql.schema.json (catches unknown fields /
      # bad selections that tsc alone does not). Both rely on the committed
      # schema + env, so no network or codegen step is needed in CI.
      - name: Lint
        # Check-only (no --fix); fails on errors, not the tolerated
        # colocation/react-doctor warnings.
        run: bun run lint:check
      - name: Typecheck
        run: bun run typecheck
      - name: GraphQL document validation
        run: bun run gql:check
      - name: Unit tests
        run: bun test

  translations:
    name: Translations synced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Re-run the full fbtee sync; a diff means source strings changed without
      # committing the regenerated translation files. Fails the build so the
      # committed translations always match the code.
      - name: Sync translations
        run: bun run i18n:sync
      - name: Fail on uncommitted translation changes
        run: git diff --exit-code translations i18n/translations
